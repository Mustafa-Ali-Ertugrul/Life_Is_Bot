[project]
name = "life_is_bot"
version = "0.1.0"
description = "Life Is Bot - Telegram sağlık ve rutin takip botu (Faz 0: çekirdek altyapı)"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot[ext]>=22.5",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "apscheduler>=3.10.4,<3.12",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "slowapi>=0.1.10",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "ruff>=0.6",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28.1",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["sqlalchemy.ext.mypy.plugin", "pydantic.mypy"]
files = ["app", "tests"]
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["slowapi", "slowapi.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
