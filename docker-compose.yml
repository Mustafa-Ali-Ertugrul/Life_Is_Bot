services:
  migrate:
    build: .
    image: life-is-bot:latest
    command: alembic upgrade head
    env_file: .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/life_is_bot.db
    volumes:
      - ./data:/app/data
    restart: "no"

  bot:
    image: life-is-bot:latest
    profiles: ["!webhook"]
    command: python -m app.main
    env_file: .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/life_is_bot.db
      BACKUP_DIR: /app/backups
      REPORTS_DIR: /app/reports
      TZ: Europe/Istanbul
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      - ./reports:/app/reports
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  api:
    image: life-is-bot:latest
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/life_is_bot.db
      REPORTS_DIR: /app/reports
      TZ: Europe/Istanbul
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
